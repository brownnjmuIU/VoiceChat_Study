# Render Blueprint. New > Blueprint in the Render dashboard, point it at this repo.
services:
  - type: web
    name: voice-chat
    runtime: node
    # Always-on ($7/mo). Free sleeps when idle, so the first participant after a
    # quiet spell waits 30-60 s. With Kokoro, use standard (2 GB) instead.
    plan: starter
    # Browser voice needs no model, so the build is just npm ci.
    # TO SWITCH BACK TO KOKORO: set TTS_BACKEND=kokoro below AND change this to
    #   npm ci && npm run prefetch-model
    # (downloads the ~90 MB model at build time instead of on first boot).
    # Kokoro measured ~1.3-4x slower than real time on a laptop CPU, so use
    # plan: standard or a GPU host before relying on it.
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production # Render does not set this; without it Express leaks stack traces
      # Required: set in the dashboard, then hand out links as https://<app>/?mode=voice&k=<token>
      - key: STUDY_TOKEN
        sync: false
      - key: LLM_MAX_TOKENS
        value: "1024" # public endpoint: cap the cost of every reply
      - key: LLM_BASE_URL
        value: https://reallms.rescloud.iu.edu/direct/v1
      - key: LLM_MODEL
        value: gpt-oss-120b
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_API_KEY
        sync: false # set in the dashboard, never in git
      - key: TTS_BACKEND
        value: browser # browser | kokoro | openai
      # Browser voice only: preferred voice name (substring), e.g. Aria, Samantha.
      # Leave blank for an automatic en-US pick. The page logs which voice played.
      - key: TTS_BROWSER_VOICE
        value: ""
      - key: TTS_VOICE # Kokoro / openai backends only
        value: af_heart
      - key: DEFAULT_MODE
        value: voice
      # --- Study data (Supabase project for THIS study only) ---
      - key: SUPABASE_URL
        sync: false # https://<project>.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false # service_role / secret key; server-side only, never in git
      # Qualtrics origin(s) allowed to receive usage counts (comma-separated)
      - key: PARENT_ORIGINS
        value: https://iu.co1.qualtrics.com
